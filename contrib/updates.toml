module = "hyperguix packages isocast-crates"
pin = '\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\).*?\(base-version "(?P<version>[^"]+)"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.isocast.packages.isocast]
url = "https://github.com/anomalyco/isocast"
patches = [
  "hyperguix/packages/aux-files/isocast-xdg-folders.patch",
  "hyperguix/packages/aux-files/isocast-any-capture-rate.patch",
]

# One repository, one pin, three packages: the app (rust/), the VS Code
# extension (vscode/) and the Zed bridge (zed/bridge).  It follows the main
# branch: every push there becomes an update.
[group.codecanvas]
file = "hyperguix/packages/codecanvas.scm"
crates = "hyperguix/packages/codecanvas-crates.scm"
module = "hyperguix packages codecanvas-crates"
pin = '\(define %codecanvas-commit "(?P<commit>[0-9a-f]{40})"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.codecanvas.packages.codecanvas]
url = "https://github.com/Lightningbulb2/CodeCanvas"
branch = "main"
npm-lock = "vscode/package-lock.json"
builds = ["codecanvas", "codecanvas-vscode", "codecanvas-zed-bridge"]
versions = [
  { name = "codecanvas", source = "rust/Cargo.toml", pin = '\(name "codecanvas"\)\s+\(version "(?P<version>[^"]+)"\)' },
  { name = "codecanvas-vscode", source = "vscode/package.json", pin = '\(name "codecanvas-vscode"\)\s+\(version "(?P<version>[^"]+)"\)' },
  { name = "codecanvas-zed-bridge", source = "zed/bridge/Cargo.toml", pin = '\(name "codecanvas-zed-bridge"\)\s+\(version "(?P<version>[^"]+)"\)' },
]

[group.codecanvas.projects.codecanvas]
package = "codecanvas"
lock = "rust/Cargo.lock"
[group.codecanvas.projects.codecanvas-zed-bridge]
package = "codecanvas"
lock = "zed/bridge/Cargo.lock"

# ---------------------------------------------------------------------------
# Packages with more to them than a commit and a hash.

[group.pandora-launcher]
file = "hyperguix/packages/pandora-launcher.scm"
# The module fetches the tag "v" + version, so there is no commit to pin.
pin = '\(name "{name}"\)\s+\(version "(?P<version>[^"]+)"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.pandora-launcher.packages.pandora-launcher]
url = "https://github.com/Moulberry/PandoraLauncher"

[group.scrcpy]
file = "hyperguix/packages/scrcpy.scm"
pin = '\(define %scrcpy-version "(?P<version>[^"]+)"\).*?\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\)\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.scrcpy.packages.scrcpy]
url = "https://github.com/Genymobile/scrcpy"
# The server that runs on the phone, prebuilt by upstream.
downloads = [
  { url = "https://github.com/Genymobile/scrcpy/releases/download/v{version}/scrcpy-server-v{version}", pin = '\(define scrcpy-server-prebuilt.*?\(base32 "(?P<hash>[0-9a-z]{52})"' },
]

# scrcpy-gui and the FAForever client share rust-crates.scm and node-deps.scm.
[group.tauri]
generate = [
  ["{python}", "contrib/update-lockfile-deps.py", "hyperguix/packages", "{src:scrcpy-gui}", "{src:faforever-client}"],
]
generated = ["hyperguix/packages/rust-crates.scm", "hyperguix/packages/node-deps.scm"]

[group.tauri.packages.scrcpy-gui]
url = "https://github.com/kil0bit-kb/scrcpy-gui"
file = "hyperguix/packages/scrcpy-gui.scm"
pin = '\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\).*?\(git-version "(?P<version>[^"]+)".*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.tauri.packages.faforever-client]
url = "https://github.com/FAForeverRustClient/FAForeverRustClient"
file = "hyperguix/packages/faforever.scm"
pin = '\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\).*?\(version "(?P<version>[^"]+)"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'
# The module pins the helper programs these scripts download.
unchanged = ["scripts/ensure-faf-uid.mjs", "scripts/ensure-faf-pioneer.mjs", "scripts/ensure-java-ice-adapter.mjs", "scripts/ensure-exp-java-ice-adapter.mjs"]
unchanged-hint = "move faf-uid-binary, faf-pioneer-binary and the ICE adapters in faforever.scm to the versions the scripts name, then update the package by hand"

[group.r2modman]
file = "hyperguix/packages/r2modman.scm"
pin = '\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\).*?\(version "(?P<version>[^"]+)"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'
generate = [
  ["{python}", "contrib/pnpm-lock-to-guix.py", "hyperguix packages r2modman-deps", "hyperguix/packages/r2modman-deps.scm", "r2modman", "{src:r2modman}/pnpm-lock.yaml"],
]
generated = ["hyperguix/packages/r2modman-deps.scm"]

[group.r2modman.packages.r2modman]
url = "https://github.com/ebkr/r2modmanPlus"

# ---------------------------------------------------------------------------
# Packages the channel patches.  A patch that stops applying turns the
# update into a report instead.

# Ladybird has no releases: it follows master.
[group.ladybird]
file = "hyperguix/packages/ladybird.scm"
crates = "hyperguix/packages/ladybird-crates.scm"
module = "hyperguix packages ladybird-crates"
pin = '\(define %ladybird-commit "(?P<commit>[0-9a-f]{40})"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.ladybird.packages.ladybird]
url = "https://github.com/LadybirdBrowser/ladybird"
branch = "master"
patches = ["hyperguix/packages/aux-files/ladybird-qt-6.9-contrast.patch"]
# Skia, ANGLE, FFmpeg and pdf.js are pinned by hand to what these files ask for.
unchanged = ["Meta/CMake/vcpkg"]
unchanged-hint = "check whether Skia, ANGLE, FFmpeg, pdf.js or their overlay patches moved; if so update them and %ladybird-ports-commit in ladybird.scm, then update the package by hand"

# COSMIC is released as a whole ("epoch"): every component gets the tag.
