# Packages that contrib/auto-update.py keeps at their latest upstream release.
#
# The updater moves a pin only when everything it can check passes: the
# source fetches, the listed patches apply, the files other pins depend on
# are unchanged, and the modules still read as Scheme.  It builds nothing.
# What it cannot update is reported (the workflow opens an issue).
#
# [group.NAME]
#   file    the module holding the pins of this group's packages
#   pin     default regular expression locating a package's pin in `file',
#           with the named groups `version', `commit' and `hash' (`commit'
#           or `version' may be missing).  {name} is replaced by the package
#           name.  `.' matches newlines.
#   tags    default for the packages' `tags'
#   crates  a module generated by cargo-lock-to-guix.py that the group
#           shares, and `module', its name
#   generate  (list of commands) other generators to run; a word starting
#           with {src:PACKAGE} becomes that package's source directory, and
#           {python} the Python running the updater
#   generated  the files those commands write
#   atomic  true: the packages are released together.  They all move to the
#           same release in one commit, once every one of them has its tag.
#           The shared version is found with `version-pin' (a pattern with
#           a `version' group); `readme-version' is how the README names it
#   builds  what to build to test an atomic group (default: its name)
#
# [group.NAME.packages.PACKAGE]
#   url     upstream git repository
#   tags    regular expression a release tag must match, with the version
#           as group 1 (default: ^v?(\d+(?:\.\d+)+)$, i.e. no pre-releases)
#   branch  follow the head of this branch instead of release tags
#   file, pin   override the group's
#   lock    path of Cargo.lock in the repository (default: Cargo.lock)
#   lfs     true: the source is fetched with Git LFS (git-fetch/lfs)
#   patches   (list) patches of the channel applied to this source; the
#           update is refused if one no longer applies
#   unchanged  (list) paths that must be identical in the old and the new
#           source, because other pins are taken from them by hand;
#           `unchanged-hint' says what to do when they are not
#   downloads  (list) files fetched next to the source: `url' (with
#           {version}) and `pin' (a pattern with a `hash' group)
#   versions  (list) further version strings in `file', each read from a
#           Cargo.toml or package.json of the source: `name' (the package),
#           `source' (the path) and `pin' (a pattern with a `version' group)
#   npm-lock  a package-lock.json in the source; every (npm-tarball ...) in
#           `file' is moved to the version it locks
#   builds  the packages to build to test this entry (default: its name)
#   frozen  true: listed only so a shared crates module can be regenerated
#
# Every project of a crates module must be listed, updated or not: the
# module is regenerated from the lockfiles of all of them.  When a project
# is not a package of its own, map it with
# [group.NAME.projects.PROJECT]: `package' and `lock'.

[group.craft]
file = "hyperguix/packages/craft.scm"
crates = "hyperguix/packages/craft-crates.scm"
module = "hyperguix packages craft-crates"
pin = '\(craft-app "{name}" "(?P<version>[^"]+)" "(?P<commit>[0-9a-f]{40})"\s+"(?P<hash>[0-9a-z]{52})"'

[group.craft.packages.photocraft]
url = "https://github.com/storytold/photocraft"
[group.craft.packages.effectcraft]
url = "https://github.com/storytold/effectcraft"
[group.craft.packages.filmcraft]
url = "https://github.com/storytold/filmcraft"
[group.craft.packages.lightcraft]
url = "https://github.com/storytold/lightcraft"
[group.craft.packages.vectorcraft]
url = "https://github.com/storytold/vectorcraft"
[group.craft.packages.designcraft]
url = "https://github.com/storytold/designcraft"
[group.craft.packages.pdfcraft]
url = "https://github.com/storytold/pdfcraft"
[group.craft.packages.wordcraft]
url = "https://github.com/storytold/wordcraft"
[group.craft.packages.gridcraft]
url = "https://github.com/storytold/gridcraft"
[group.craft.packages.soundcraft]
url = "https://github.com/storytold/soundcraft"
[group.craft.packages.cadcraft]
url = "https://github.com/storytold/cadcraft"
[group.craft.packages.figcraft]
url = "https://github.com/storytold/figcraft"
[group.craft.packages.deckcraft]
url = "https://github.com/storytold/deckcraft"
[group.craft.packages.texturecraft]
url = "https://github.com/storytold/texturecraft"
[group.craft.packages.craft-anything]
url = "https://github.com/storytold/craft-anything"
[group.craft.packages.craft-launcher]
url = "https://github.com/storytold/craft-launcher"

[group.solidcraft]
file = "hyperguix/packages/solidcraft.scm"
crates = "hyperguix/packages/solidcraft-crates.scm"
module = "hyperguix packages solidcraft-crates"
pin = '\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\).*?\(git-version "(?P<version>[^"]+)".*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.solidcraft.packages.solidcraft]
url = "https://github.com/tangency-labs/solidcraft"

[group.mailcraft]
file = "hyperguix/packages/mailcraft.scm"
crates = "hyperguix/packages/mailcraft-crates.scm"
module = "hyperguix packages mailcraft-crates"
pin = '\(define-public {name}\s+\(let \(\(commit "(?P<commit>[0-9a-f]{40})"\).*?\(base-version "(?P<version>[^"]+)"\).*?\(base32 "(?P<hash>[0-9a-z]{52})"'

[group.mailcraft.packages.mailcraft]
